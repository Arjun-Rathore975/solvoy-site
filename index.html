<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root {
    --dusk: #18213B;
    --harbour: #2C6878;
    --jacaranda: #7A68B3;
    --glow: #E9A97F;
    --text: #F3F1F7;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--dusk);
    color: var(--text);
    font-family: "Fraunces", Georgia, "Times New Roman", serif;
    overflow: hidden;
  }

  /* Soft drifting light, like dusk over the harbour */
  .sky { position: fixed; inset: 0; overflow: hidden; }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.55;
  }
  .orb.a { width: 60vmax; height: 60vmax; background: var(--harbour); left: -15vmax; bottom: -25vmax; }
  .orb.b { width: 45vmax; height: 45vmax; background: var(--jacaranda); right: -12vmax; top: -15vmax; opacity: 0.45; }
  .orb.c { width: 30vmax; height: 30vmax; background: var(--glow); left: 40%; top: 55%; opacity: 0.22; }

  /* Fine grain so the gradients feel like paper, not a screen */
  .grain {
    position: fixed; inset: -50%;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.5'/></svg>");
    opacity: 0.08;
    pointer-events: none;
  }

  main {
    position: relative;
    min-height: 100%;
    display: grid;
    place-items: center;
    text-align: center;
    padding: env(safe-area-inset-top, 0px) 1.5rem env(safe-area-inset-bottom, 0px);
  }
  h1 {
    font-weight: 300;
    font-size: clamp(3rem, 11vw, 8.5rem);
    letter-spacing: -0.03em;
    line-height: 0.95;
  }
  p {
    margin-top: 1.4rem;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1.05rem, 2.4vw, 1.5rem);
    opacity: 0.8;
  }

  /* Survey button */
  .survey-btn {
    display: inline-block;
    margin-top: 2.2rem;
    padding: 0.85rem 1.6rem;
    border: 1px solid rgba(243, 241, 247, 0.5);
    border-radius: 999px;
    color: var(--text);
    text-decoration: none;
    font-size: 1rem;
    transition: background 0.3s, border-color 0.3s;
  }
  .survey-btn:hover { background: rgba(243, 241, 247, 0.12); border-color: var(--text); }
  .survey-btn:focus-visible { outline: 2px solid var(--glow); outline-offset: 4px; }

  @media (prefers-reduced-motion: no-preference) {
    .orb.a { animation: drift-a 38s ease-in-out infinite alternate; }
    .orb.b { animation: drift-b 46s ease-in-out infinite alternate; }
    .orb.c { animation: drift-c 30s ease-in-out infinite alternate; }
    @keyframes drift-a { to { transform: translate(18vw, -10vh) scale(1.1); } }
    @keyframes drift-b { to { transform: translate(-20vw, 14vh) scale(0.9); } }
    @keyframes drift-c { to { transform: translate(-25vw, -30vh) scale(1.25); } }

    h1, p, .survey-btn { animation: rise 1.6s cubic-bezier(.2,.7,.2,1) both; }
    p { animation-delay: 0.5s; }
    .survey-btn { animation-delay: 1s; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  }
</style>
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="orb a"></div>
    <div class="orb b"></div>
    <div class="orb c"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>

  <main>
    <div>
      <h1>coming soon</h1>
      <p>with love from Sydney</p>
      <a class="survey-btn" href="https://forms.gle/iR6QyNSDQ16tVfNr8" target="_blank" rel="noopener">Take our 60-second survey</a>
    </div>
  </main>
</body>
</html>
